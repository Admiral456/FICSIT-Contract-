name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test portable contract engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate plugin manifest and source layout (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/validate_manifest.py
      - name: Validate plugin manifest and source layout (Windows)
        if: runner.os == 'Windows'
        run: py -3 scripts/validate_manifest.py
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
